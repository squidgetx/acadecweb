<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">
    <img src="{{ '/assets/images/Logo.svg' | relative_url }}" alt="{{ site.title }}" class="logo">
  </a>
  {% if site.tagline %}<p class="site-tagline">{{ site.tagline }}</p>{% endif %}
  <nav class="site-nav">
    <ul>
      {% for item in site.nav %}
      <li>
        {% assign item_url = item.url | relative_url %}
        <a class="nav-link{% if page.url == item.url %} active{% endif %}" href="{{ item_url }}">{{ item.title }}</a>
      </li>
      {% endfor %}
    </ul>
  </nav>
</header>
